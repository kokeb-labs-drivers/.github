title: A driver sits between your code and the chip
kicker: Kokeb Labs Drivers
subtitle: The driver and the port contract are the same on every MCU. Only the port is yours.
alt: >-
  Pipeline in which your application calls a chip driver, the driver talks to a port that moves bytes on your
  SPI, I2C, UART or ADC bus, and the port drives the chip.
reads: >-
  The Application column is your code, which calls one driver object. The Driver column is the chip logic, the same
  on every MCU, which turns calls into register reads and writes. The Port column is a small class you write once for
  your bus and MCU. The Chip column is the part on your board.
