<text x="48" y="162.8" font-size="13" font-weight="700" class="fk-f-blue-text">INTAKE</text>
<text x="298" y="162.8" font-size="13" font-weight="700" class="fk-f-teal-text">MAKE</text>
<text x="548" y="162.8" font-size="13" font-weight="700" class="fk-f-amber-text">CHECK</text>
<text x="798" y="162.8" font-size="13" font-weight="700" class="fk-f-violet-text">PUBLISH</text>
<text x="1048" y="162.8" font-size="13" font-weight="700" class="fk-f-green-text">PROVE</text>
<text x="64" y="217.6" font-size="15" font-weight="700" class="fk-f-ink">1 Request</text>
<text x="64" y="242.4" font-size="13" class="fk-f-ink2">one chip</text>
<text x="64" y="261.2" font-size="13" class="fk-f-ink2">a public datasheet link</text>
<text x="64" y="321.6" font-size="15" font-weight="700" class="fk-f-ink">2 Triage</text>
<text x="64" y="346.4" font-size="13" class="fk-f-ink2">duplicates</text>
<text x="64" y="365.2" font-size="13" class="fk-f-ink2">scope</text>
<text x="64" y="384.1" font-size="13" class="fk-f-ink2">documents</text>
<text x="314" y="217.6" font-size="15" font-weight="700" class="fk-f-ink">3 Placement</text>
<text x="314" y="242.4" font-size="13" class="fk-f-ink2">which repository</text>
<text x="314" y="302.6" font-size="15" font-weight="700" class="fk-f-ink">4 Design</text>
<text x="314" y="327.4" font-size="13" class="fk-f-ink2">architecture note</text>
<text x="314" y="387.6" font-size="15" font-weight="700" class="fk-f-ink">5 Build</text>
<text x="314" y="412.4" font-size="13" class="fk-f-ink2">code, tests, docs</text>
<text x="564" y="217.6" font-size="15" font-weight="700" class="fk-f-ink">6 Independent</text>
<text x="564" y="237.1" font-size="15" font-weight="700" class="fk-f-ink">review</text>
<text x="564" y="261.9" font-size="13" class="fk-f-ink2">reviewed apart from</text>
<text x="564" y="280.8" font-size="13" class="fk-f-ink2">the author</text>
<text x="564" y="340.6" font-size="15" font-weight="700" class="fk-f-ink">7 Private CI</text>
<text x="564" y="360.1" font-size="15" font-weight="700" class="fk-f-ink">rehearsal</text>
<text x="564" y="384.9" font-size="13" class="fk-f-ink2">full checks before</text>
<text x="564" y="403.8" font-size="13" class="fk-f-ink2">anything is public</text>
<text x="814" y="217.6" font-size="15" font-weight="700" class="fk-f-ink">8 Clean public</text>
<text x="814" y="237.1" font-size="15" font-weight="700" class="fk-f-ink">copy</text>
<text x="814" y="261.9" font-size="13" class="fk-f-ink2">made after the</text>
<text x="814" y="280.8" font-size="13" class="fk-f-ink2">rehearsal passes</text>
<text x="814" y="340.6" font-size="15" font-weight="700" class="fk-f-ink">9 Release</text>
<text x="814" y="360.1" font-size="15" font-weight="700" class="fk-f-ink">candidate</text>
<text x="814" y="384.9" font-size="13" class="fk-f-ink2">tag vX.Y.Z-rc.N</text>
<text x="1064" y="217.6" font-size="15" font-weight="700" class="fk-f-ink">10 Hardware</text>
<text x="1064" y="237.1" font-size="15" font-weight="700" class="fk-f-ink">validation</text>
<text x="1064" y="261.9" font-size="13" class="fk-f-ink2">levels H0 to H2</text>
<text x="1064" y="321.6" font-size="15" font-weight="700" class="fk-f-ink">11 Release</text>
<text x="1064" y="346.4" font-size="13" class="fk-f-ink2">tag vX.Y.Z</text>
