<text x="32" y="77.3" font-size="26" font-weight="700" class="fk-f-ink">How a driver is built</text>
<text x="32" y="103.8" font-size="15" class="fk-f-muted">Eleven steps in five stages. Nothing is released on one author's word.</text>
