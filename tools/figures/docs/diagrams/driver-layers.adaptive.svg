<text x="48" y="162.8" font-size="13" font-weight="700" class="fk-f-blue-text">APPLICATION</text>
<text x="342" y="162.8" font-size="13" font-weight="700" class="fk-f-teal-text">DRIVER</text>
<text x="636" y="162.8" font-size="13" font-weight="700" class="fk-f-amber-text">PORT</text>
<text x="930" y="162.8" font-size="13" font-weight="700" class="fk-f-violet-text">CHIP</text>
<text x="64" y="217.6" font-size="15" font-weight="700" class="fk-f-ink">Your code</text>
<text x="64" y="242.4" font-size="13" class="fk-f-ink2">calls the driver</text>
<text x="358" y="217.6" font-size="15" font-weight="700" class="fk-f-ink">driver-chip</text>
<text x="358" y="242.4" font-size="13" class="fk-f-ink2">chip logic</text>
<text x="358" y="261.2" font-size="13" class="fk-f-ink2">same on every MCU</text>
<text x="358" y="280.1" font-size="13" class="fk-f-ink2">results you must check</text>
<text x="652" y="217.6" font-size="15" font-weight="700" class="fk-f-ink">Bus functions</text>
<text x="652" y="242.4" font-size="13" class="fk-f-ink2">SPI or I2C or UART or</text>
<text x="652" y="261.2" font-size="13" class="fk-f-ink2">ADC</text>
<text x="652" y="280.1" font-size="13" class="fk-f-ink2">you write it once</text>
<text x="946" y="217.6" font-size="15" font-weight="700" class="fk-f-ink">The part</text>
<text x="946" y="242.4" font-size="13" class="fk-f-ink2">on your board</text>
