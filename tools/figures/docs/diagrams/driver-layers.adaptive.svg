<rect x="0.5" y="0.5" width="1175" height="347" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">KOKEB LABS DRIVERS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" class="fk-f-ink">A driver sits between your code and the chip</text>
<text x="32" y="103.8" font-size="15" class="fk-f-muted">The driver and the port contract are the same on every MCU. Only the port is yours.</text>
<rect x="32" y="119.8" width="1112" height="1" class="fk-f-hair"/>
