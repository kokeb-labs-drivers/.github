<rect x="620" y="137.8" width="230" height="180" rx="14" fill="#2C2310" stroke="#6A5220" stroke-width="1.2"/>
<rect x="914" y="137.8" width="230" height="180" rx="14" fill="#221A3A" stroke="#4B3A82" stroke-width="1.2"/>
<path d="M254 225.3 L286 225.3 Q294 225.3 294 233.3 L294 236.3 Q294 244.3 302 244.3 L334 244.3" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#driver-layers-arrow-rail)"/>
<path d="M548 244.3 L628 244.3" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#driver-layers-arrow-rail)"/>
<path d="M842 244.3 L874 244.3 Q882 244.3 882 236.3 L882 233.3 Q882 225.3 890 225.3 L922 225.3" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#driver-layers-arrow-rail)"/>
<rect x="44" y="190.8" width="206" height="69" rx="10" fill="#151C26" stroke="#6C7889" stroke-width="1"/>
<rect x="44" y="198.8" width="4" height="53" rx="2" fill="#60A5FA"/>
<rect x="338" y="190.8" width="206" height="107" rx="10" fill="#151C26" stroke="#6C7889" stroke-width="1"/>
<rect x="338" y="198.8" width="4" height="91" rx="2" fill="#2BB3A3"/>
<rect x="632" y="190.8" width="206" height="107" rx="10" fill="#151C26" stroke="#6C7889" stroke-width="1"/>
<rect x="632" y="198.8" width="4" height="91" rx="2" fill="#FBBF24"/>
<rect x="926" y="190.8" width="206" height="69" rx="10" fill="#151C26" stroke="#6C7889" stroke-width="1"/>
<rect x="926" y="198.8" width="4" height="53" rx="2" fill="#A78BFA"/>
<text x="48" y="162.8" font-size="13" font-weight="700" fill="#BFDBFE">APPLICATION</text>
<text x="342" y="162.8" font-size="13" font-weight="700" fill="#A7F3E6">DRIVER</text>
<text x="636" y="162.8" font-size="13" font-weight="700" fill="#FDE68A">PORT</text>
<text x="930" y="162.8" font-size="13" font-weight="700" fill="#DDD6FE">CHIP</text>
<text x="64" y="217.6" font-size="15" font-weight="700" fill="#E8EDF3">Your code</text>
<text x="64" y="242.4" font-size="13" fill="#D2DAE4">calls the driver</text>
<text x="358" y="217.6" font-size="15" font-weight="700" fill="#E8EDF3">driver-chip</text>
<text x="358" y="242.4" font-size="13" fill="#D2DAE4">chip logic</text>
<text x="358" y="261.2" font-size="13" fill="#D2DAE4">same on every MCU</text>
<text x="358" y="280.1" font-size="13" fill="#D2DAE4">results you must check</text>
<text x="652" y="217.6" font-size="15" font-weight="700" fill="#E8EDF3">Bus functions</text>
<text x="652" y="242.4" font-size="13" fill="#D2DAE4">SPI or I2C or UART or</text>
<text x="652" y="261.2" font-size="13" fill="#D2DAE4">ADC</text>
<text x="652" y="280.1" font-size="13" fill="#D2DAE4">you write it once</text>
<text x="946" y="217.6" font-size="15" font-weight="700" fill="#E8EDF3">The part</text>
<text x="946" y="242.4" font-size="13" fill="#D2DAE4">on your board</text>
<rect x="274.1" y="224.8" width="39.8" height="20" rx="10" fill="#0E131A"/>
<text x="294" y="239.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">calls</text>
<rect x="565.1" y="234.3" width="45.8" height="20" rx="10" fill="#0E131A"/>
<text x="588" y="248.6" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">bytes</text>
<rect x="864.8" y="224.8" width="34.4" height="20" rx="10" fill="#0E131A"/>
<text x="882" y="239.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">bus</text>
</svg>
