<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="348" viewBox="0 0 1176 348" role="img" aria-labelledby="driver-layers-title driver-layers-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="driver-layers-title">A driver sits between your code and the chip</title>
<desc id="driver-layers-desc">Pipeline in which your application calls a chip driver, the driver talks to a port that moves bytes on your SPI, I2C, UART or ADC bus, and the port drives the chip.</desc>
<defs><marker id="driver-layers-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker></defs>
<rect x="0.5" y="0.5" width="1175" height="347" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">KOKEB LABS DRIVERS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">A driver sits between your code and the chip</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">The driver and the port contract are the same on every MCU. Only the port is yours.</text>
<rect x="32" y="119.8" width="1112" height="1" fill="#252F3C"/>
<rect x="32" y="137.8" width="230" height="180" rx="14" fill="#13233A" stroke="#2B4C78" stroke-width="1.2"/>
