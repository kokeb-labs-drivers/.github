<svg xmlns="http://www.w3.org/2000/svg" width="1274" height="480" viewBox="0 0 1274 480" role="img" aria-labelledby="driver-pipeline-title driver-pipeline-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="driver-pipeline-title">How a driver is built</title>
<desc id="driver-pipeline-desc">Pipeline from a driver request through triage, design, build, independent review, a private CI rehearsal, a clean public copy, a release candidate and hardware validation to a release.</desc>
