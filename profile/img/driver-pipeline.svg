<text x="48" y="162.8" font-size="13" font-weight="700" fill="#1E429F">INTAKE</text>
<text x="298" y="162.8" font-size="13" font-weight="700" fill="#0B5F59">MAKE</text>
<text x="548" y="162.8" font-size="13" font-weight="700" fill="#8A3C0B">CHECK</text>
<text x="798" y="162.8" font-size="13" font-weight="700" fill="#5B21B6">PUBLISH</text>
<text x="1048" y="162.8" font-size="13" font-weight="700" fill="#14532D">PROVE</text>
<text x="64" y="217.6" font-size="15" font-weight="700" fill="#0E1726">1 Request</text>
<text x="64" y="242.4" font-size="13" fill="#2B3442">one chip</text>
<text x="64" y="261.2" font-size="13" fill="#2B3442">a public datasheet link</text>
<text x="64" y="321.6" font-size="15" font-weight="700" fill="#0E1726">2 Triage</text>
<text x="64" y="346.4" font-size="13" fill="#2B3442">duplicates</text>
<text x="64" y="365.2" font-size="13" fill="#2B3442">scope</text>
<text x="64" y="384.1" font-size="13" fill="#2B3442">documents</text>
<text x="314" y="217.6" font-size="15" font-weight="700" fill="#0E1726">3 Placement</text>
<text x="314" y="242.4" font-size="13" fill="#2B3442">which repository</text>
<text x="314" y="302.6" font-size="15" font-weight="700" fill="#0E1726">4 Design</text>
<text x="314" y="327.4" font-size="13" fill="#2B3442">architecture note</text>
<text x="314" y="387.6" font-size="15" font-weight="700" fill="#0E1726">5 Build</text>
<text x="314" y="412.4" font-size="13" fill="#2B3442">code, tests, docs</text>
<text x="564" y="217.6" font-size="15" font-weight="700" fill="#0E1726">6 Independent</text>
<text x="564" y="237.1" font-size="15" font-weight="700" fill="#0E1726">review</text>
<text x="564" y="261.9" font-size="13" fill="#2B3442">reviewed apart from</text>
<text x="564" y="280.8" font-size="13" fill="#2B3442">the author</text>
<text x="564" y="340.6" font-size="15" font-weight="700" fill="#0E1726">7 Private CI</text>
<text x="564" y="360.1" font-size="15" font-weight="700" fill="#0E1726">rehearsal</text>
<text x="564" y="384.9" font-size="13" fill="#2B3442">full checks before</text>
<text x="564" y="403.8" font-size="13" fill="#2B3442">anything is public</text>
<text x="814" y="217.6" font-size="15" font-weight="700" fill="#0E1726">8 Clean public</text>
<text x="814" y="237.1" font-size="15" font-weight="700" fill="#0E1726">copy</text>
<text x="814" y="261.9" font-size="13" fill="#2B3442">made after the</text>
<text x="814" y="280.8" font-size="13" fill="#2B3442">rehearsal passes</text>
<text x="814" y="340.6" font-size="15" font-weight="700" fill="#0E1726">9 Release</text>
<text x="814" y="360.1" font-size="15" font-weight="700" fill="#0E1726">candidate</text>
<text x="814" y="384.9" font-size="13" fill="#2B3442">tag vX.Y.Z-rc.N</text>
<text x="1064" y="217.6" font-size="15" font-weight="700" fill="#0E1726">10 Hardware</text>
<text x="1064" y="237.1" font-size="15" font-weight="700" fill="#0E1726">validation</text>
<text x="1064" y="261.9" font-size="13" fill="#2B3442">levels H0 to H2</text>
<text x="1064" y="321.6" font-size="15" font-weight="700" fill="#0E1726">11 Release</text>
<text x="1064" y="346.4" font-size="13" fill="#2B3442">tag vX.Y.Z</text>
</svg>
