<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="348" viewBox="0 0 1176 348" role="img" aria-labelledby="driver-layers-title driver-layers-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="driver-layers-title">A driver sits between your code and the chip</title>
<desc id="driver-layers-desc">Pipeline in which your application calls a chip driver, the driver talks to a port that moves bytes on your SPI, I2C, UART or ADC bus, and the port drives the chip.</desc>
<defs><marker id="driver-layers-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8798"/></marker></defs>
<rect x="0.5" y="0.5" width="1175" height="347" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">KOKEB LABS DRIVERS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">A driver sits between your code and the chip</text>
<text x="32" y="103.8" font-size="15" fill="#566070">The driver and the port contract are the same on every MCU. Only the port is yours.</text>
<rect x="32" y="119.8" width="1112" height="1" fill="#E2E7EE"/>
<rect x="32" y="137.8" width="230" height="180" rx="14" fill="#EAF2FF" stroke="#BCD2F9" stroke-width="1.2"/>
<rect x="326" y="137.8" width="230" height="180" rx="14" fill="#E6F6F4" stroke="#A6DCD5" stroke-width="1.2"/>
<rect x="620" y="137.8" width="230" height="180" rx="14" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1.2"/>
<rect x="914" y="137.8" width="230" height="180" rx="14" fill="#F3EEFF" stroke="#D5C5FA" stroke-width="1.2"/>
<path d="M254 225.3 L286 225.3 Q294 225.3 294 233.3 L294 236.3 Q294 244.3 302 244.3 L334 244.3" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#driver-layers-arrow-rail)"/>
<path d="M548 244.3 L628 244.3" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#driver-layers-arrow-rail)"/>
<path d="M842 244.3 L874 244.3 Q882 244.3 882 236.3 L882 233.3 Q882 225.3 890 225.3 L922 225.3" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#driver-layers-arrow-rail)"/>
<rect x="44" y="190.8" width="206" height="69" rx="10" fill="#FFFFFF" stroke="#738093" stroke-width="1"/>
<rect x="44" y="198.8" width="4" height="53" rx="2" fill="#2563EB"/>
<rect x="338" y="190.8" width="206" height="107" rx="10" fill="#FFFFFF" stroke="#738093" stroke-width="1"/>
<rect x="338" y="198.8" width="4" height="91" rx="2" fill="#0B7A72"/>
<rect x="632" y="190.8" width="206" height="107" rx="10" fill="#FFFFFF" stroke="#738093" stroke-width="1"/>
<rect x="632" y="198.8" width="4" height="91" rx="2" fill="#C26A05"/>
<rect x="926" y="190.8" width="206" height="69" rx="10" fill="#FFFFFF" stroke="#738093" stroke-width="1"/>
<rect x="926" y="198.8" width="4" height="53" rx="2" fill="#7C3AED"/>
<text x="48" y="162.8" font-size="13" font-weight="700" fill="#1E429F">APPLICATION</text>
<text x="342" y="162.8" font-size="13" font-weight="700" fill="#0B5F59">DRIVER</text>
<text x="636" y="162.8" font-size="13" font-weight="700" fill="#8A3C0B">PORT</text>
<text x="930" y="162.8" font-size="13" font-weight="700" fill="#5B21B6">CHIP</text>
<text x="64" y="217.6" font-size="15" font-weight="700" fill="#0E1726">Your code</text>
<text x="64" y="242.4" font-size="13" fill="#2B3442">calls the driver</text>
<text x="358" y="217.6" font-size="15" font-weight="700" fill="#0E1726">driver-chip</text>
<text x="358" y="242.4" font-size="13" fill="#2B3442">chip logic</text>
<text x="358" y="261.2" font-size="13" fill="#2B3442">same on every MCU</text>
<text x="358" y="280.1" font-size="13" fill="#2B3442">results you must check</text>
<text x="652" y="217.6" font-size="15" font-weight="700" fill="#0E1726">Bus functions</text>
<text x="652" y="242.4" font-size="13" fill="#2B3442">SPI or I2C or UART or</text>
<text x="652" y="261.2" font-size="13" fill="#2B3442">ADC</text>
<text x="652" y="280.1" font-size="13" fill="#2B3442">you write it once</text>
<text x="946" y="217.6" font-size="15" font-weight="700" fill="#0E1726">The part</text>
<text x="946" y="242.4" font-size="13" fill="#2B3442">on your board</text>
<rect x="274.1" y="224.8" width="39.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="294" y="239.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">calls</text>
<rect x="565.1" y="234.3" width="45.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="588" y="248.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">bytes</text>
<rect x="864.8" y="224.8" width="34.4" height="20" rx="10" fill="#FFFFFF"/>
<text x="882" y="239.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">bus</text>
</svg>
