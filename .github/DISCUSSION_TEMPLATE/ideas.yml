body:
  - type: input
    id: driver
    attributes:
      label: Driver
      description: The driver the idea is for, or "new" for a chip that has none yet.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: The API or behaviour you have in mind. Sketch code if it helps.
